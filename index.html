<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CartShare</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary no-print">
  <div class="container"><span class="navbar-brand fw-bold">🛒 CartShare</span>
  <div id="roomBadge" class="text-white small d-none"></div></div>
</nav>

<main class="container py-4">
  <!-- Login / join -->
  <section id="loginView" class="row justify-content-center no-print">
    <div class="col-12 col-md-6 col-lg-4">
      <form id="joinForm" class="card card-body shadow-sm">
        <h1 class="h4 mb-3">Join a room</h1>
        <label class="form-label" for="userName">Your name</label>
        <input id="userName" class="form-control mb-3" required maxlength="20">
        <label class="form-label" for="roomCode">Room code</label>
        <input id="roomCode" class="form-control mb-1" required maxlength="12" placeholder="e.g. DORM42">
        <div class="form-text mb-3">New code = new room. Same code = join your group.</div>
        <button class="btn btn-primary w-100">Enter room</button>
        <button type="button" id="genBtn" class="btn btn-link btn-sm mt-2">Generate a random code</button>
      </form>
    </div>
  </section>

  <!-- Room -->
  <section id="roomView" class="d-none">
    <div class="row g-4">
      <div class="col-12 col-lg-8 no-print">
        <form id="itemForm" class="card card-body shadow-sm mb-3">
          <div class="row g-2">
            <div class="col-12 col-sm-5"><input id="itemName" class="form-control" placeholder="Item" required maxlength="40"></div>
            <div class="col-6 col-sm-3"><input id="itemPrice" type="number" min="0" step="0.01" class="form-control" placeholder="Price" required></div>
            <div class="col-6 col-sm-2"><input id="itemQty" type="number" min="1" value="1" class="form-control" required></div>
            <div class="col-12 col-sm-2"><button class="btn btn-success w-100">Add</button></div>
          </div>
        </form>
        <div class="card shadow-sm">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead><tr><th>Item</th><th>By</th><th class="text-end">Qty</th><th class="text-end">Total</th><th></th></tr></thead>
              <tbody id="cartBody"></tbody>
            </table>
          </div>
          <div class="card-body border-top">
            <div class="d-flex justify-content-between fw-bold"><span>Cart total</span><span id="total">$0.00</span></div>
            <div class="progress my-2" style="height:14px"><div id="bar" class="progress-bar"></div></div>
            <div id="thresholdMsg" class="small text-muted"></div>
          </div>
        </div>
      </div>

      <aside class="col-12 col-lg-4 no-print">
        <div class="card shadow-sm mb-3"><div class="card-body">
          <h2 class="h6">Who owes what</h2><ul id="splits" class="list-unstyled mb-0"></ul>
        </div></div>
        <div class="card shadow-sm mb-3"><div class="card-body">
          <h2 class="h6">Activity log</h2><ul id="log" class="list-unstyled small mb-0 log"></ul>
        </div></div>
        <button id="printBtn" class="btn btn-outline-primary w-100 mb-2">🖨 Print receipt</button>
        <button id="leaveBtn" class="btn btn-outline-secondary w-100">Leave room</button>
      </aside>
    </div>
  </section>

  <!-- Printable receipt (visible only when printing) -->
  <section id="receipt"></section>
</main>
<script src="js/app.js"></script>
</body>
</html>
